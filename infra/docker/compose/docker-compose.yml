services:
  postgres:
    image: postgres:16-alpine
    container_name: praxis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis123}
      POSTGRES_DB: ${POSTGRES_DB:-praxis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praxis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: praxis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Redis guarda las sesiones (auth:sessions:<userId>), no solo caché.
    # Sin volumen vivian en la capa del contenedor: recrearlo -por un `down`,
    # por tocar este archivo o por una actualizacion de Docker- echaba a todo
    # el mundo a la vez. Con volumen sobreviven, y el `--appendonly yes` hace
    # que sobrevivan tambien a un corte, no solo a los snapshots cada 5 min.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  postgres_data:
    name: praxis_postgres_data
  redis_data:
    name: praxis_redis_data